name: pothik_passenger
description: "পথিক (Pothik) — passenger ride-hailing app for Bangladesh."
publish_to: 'none'

# Semantic version + build number. CI overrides via --build-name / --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / DI
  flutter_riverpod: ^3.4.3
  equatable: ^2.1.0

  # Navigation
  go_router: ^17.5.0

  # Network / realtime
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.1

  # Storage
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5

  # Platform
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  app_settings: ^9.0.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # Observability
  sentry_flutter: ^9.30.0

  # Utilities
  intl: ^0.20.2 # pinned by flutter_localizations
  uuid: ^4.6.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  stream_channel: ^2.1.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0C8B51"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/illustrations/

  # Hind Siliguri is bundled (OFL) so Bangla text never falls back to a
  # mismatched system font on budget Android devices.
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
