# Pothik Passenger — CI
#
# Branch model (from pothik-passenger-app-production.md):
#   feature/* -> PR -> develop  : lint + test + debug APK (fake backend)
#   develop   -> staging build  : signed AAB against staging API, internal track
#   main (tag v*) -> prod build : signed AAB + IPA, manual approval gate
#
# Secrets expected (Settings > Secrets and variables > Actions):
#   MAPS_API_KEY_ANDROID, MAPS_API_KEY_IOS
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   ENV_STAGING_JSON, ENV_PROD_JSON   (contents of env/<env>.json)
#   SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze, test, l10n check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generated l10n is up to date & every EN key exists in BN
        run: |
          flutter gen-l10n
          dart run tool/check_l10n.dart

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (warnings are errors)
        run: flutter analyze --no-pub --fatal-infos

      - name: Test with coverage
        run: flutter test --no-pub --coverage --reporter expanded

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  android-debug:
    name: Android debug APK (fake backend)
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }

      - run: flutter pub get
      - run: cp env/dev.example.json env/dev.json
      - run: flutter build apk --debug --dart-define-from-file=env/dev.json
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}

      - uses: actions/upload-artifact@v4
        with:
          name: pothik-passenger-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ---------------------------------------------------------------------------
  android-release:
    name: Android release AAB (${{ (startsWith(github.ref, 'refs/tags/v') && 'prod') || 'staging' }})
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }

      - run: flutter pub get

      - name: Write env + keystore from secrets
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo '${{ secrets.ENV_PROD_JSON }}' > env/build.json
          else
            echo '${{ secrets.ENV_STAGING_JSON }}' > env/build.json
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build number = run number (monotonic across builds)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build AAB (obfuscated, split debug info)
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=env/build.json \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}

      - name: Upload symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload --include-sources build/symbols
          sentry-cli debug-files upload build/app/outputs/mapping/release/mapping.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: pothik-passenger-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
            build/symbols
          retention-days: 90

      # Play upload is intentionally a separate, manually-triggered step
      # (see .github/workflows/release-play.yml when added) so a green CI
      # never ships to users without a human pressing the button.

  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS IPA (prod, unsigned archive)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }

      - run: flutter pub get
      - run: echo '${{ secrets.ENV_PROD_JSON }}' > env/build.json
      - run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY_IOS }}" > ios/Flutter/Secrets.xcconfig

      # Signing happens in Xcode Cloud / fastlane match on the release runner;
      # this job only proves the archive compiles with prod config.
      - run: |
          flutter build ipa --release --no-codesign \
            --dart-define-from-file=env/build.json \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols-ios

      - uses: actions/upload-artifact@v4
        with:
          name: pothik-passenger-ios-xcarchive
          path: build/ios/archive
          retention-days: 30
